services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: giglister
      POSTGRES_USER: giglister
      POSTGRES_PASSWORD: giglister
    ports:
      - "5432:5432"
    volumes:
      - giglister-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giglister -d giglister"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GIGLISTER_DB_HOST: db
      GIGLISTER_DB_PORT: 5432
      GIGLISTER_DB_NAME: giglister
      GIGLISTER_DB_USER: giglister
      GIGLISTER_DB_PASSWORD: giglister
      GIGLISTER_JWT_SECRET: ${GIGLISTER_JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      GIGLISTER_ADMIN_EMAIL: ${GIGLISTER_ADMIN_EMAIL:-}
      GIGLISTER_FRONTEND_URL: http://localhost:3000
      # No GIGLISTER_MAIL_HOST set: verification/reset links are written to
      # `docker compose logs backend` instead of actually being emailed - set
      # GIGLISTER_MAIL_HOST/PORT/USER/PASSWORD/FROM for a real SMTP server.
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at image build time - this is what the *browser* calls, so
        # it must be reachable from the host, not just the Docker network.
        NEXT_PUBLIC_API_URL: ${GIGLISTER_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server-side (Server Components/Actions) calls go through the Docker
      # network directly to the backend service.
      API_BASE_URL: http://backend:8080
    ports:
      - "3000:3000"

volumes:
  giglister-db-data:

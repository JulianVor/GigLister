services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: giglister
      POSTGRES_USER: giglister
      POSTGRES_PASSWORD: giglister
    ports:
      - "${GIGLISTER_DB_PORT:-5432}:5432"
    volumes:
      - giglister-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giglister -d giglister"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the backend sends instead of delivering it anywhere -
  # view them at http://localhost:8025 (GIGLISTER_MAILPIT_PORT). Only used
  # while GIGLISTER_MAIL_HOST points at it (the default, see below); once you
  # set GIGLISTER_MAIL_HOST to a real SMTP server this container just sits
  # idle and unused.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # Bound to the exact same GIGLISTER_MAIL_PORT (and default) the
      # backend below uses, rather than a hardcoded port picked to match
      # whatever this project's mail-port default happened to be at some
      # point in time - an existing .env can have any value here (already
      # true twice over: 587 predates Mailpit, 1025 is Mailpit's own
      # default) and the two sides can never disagree, since they resolve
      # from the same source.
      MP_SMTP_BIND_ADDR: 0.0.0.0:${GIGLISTER_MAIL_PORT:-587}
    ports:
      - "127.0.0.1:${GIGLISTER_MAILPIT_PORT:-8025}:8025"

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      GIGLISTER_DB_HOST: db
      GIGLISTER_DB_PORT: 5432
      GIGLISTER_DB_NAME: giglister
      GIGLISTER_DB_USER: giglister
      GIGLISTER_DB_PASSWORD: giglister
      GIGLISTER_JWT_SECRET: ${GIGLISTER_JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      GIGLISTER_ADMIN_EMAIL: ${GIGLISTER_ADMIN_EMAIL:-}
      # Used to build the links inside verification/reset emails - keep this
      # in sync with GIGLISTER_FRONTEND_PORT below.
      GIGLISTER_FRONTEND_URL: ${GIGLISTER_FRONTEND_URL:-http://localhost:3000}
      # Defaults to the mailpit service below, which always binds to this
      # exact same GIGLISTER_MAIL_PORT (see its MP_SMTP_BIND_ADDR) - so
      # every verification/reset email sent in a Compose setup is
      # catchable at :8025 (see GIGLISTER_MAILPIT_PORT) without any config,
      # whatever value GIGLISTER_MAIL_PORT already has. Point these at a
      # real SMTP server instead once you actually want mail delivered.
      GIGLISTER_MAIL_HOST: ${GIGLISTER_MAIL_HOST:-mailpit}
      GIGLISTER_MAIL_PORT: ${GIGLISTER_MAIL_PORT:-587}
      GIGLISTER_MAIL_USER: ${GIGLISTER_MAIL_USER:-}
      GIGLISTER_MAIL_PASSWORD: ${GIGLISTER_MAIL_PASSWORD:-}
      GIGLISTER_MAIL_FROM: ${GIGLISTER_MAIL_FROM:-no-reply@giglister.local}
      GIGLISTER_UPLOAD_DIR: /data/uploads
      # Uploaded images are stored on disk and served back out under
      # /uploads/** - this must be the same browser-reachable URL as the
      # frontend's NEXT_PUBLIC_API_URL above, so an uploaded image's URL
      # resolves for anyone viewing the page, not just inside the Docker network.
      GIGLISTER_PUBLIC_API_URL: ${GIGLISTER_PUBLIC_API_URL:-http://localhost:8080}
      # One value drives the backend's own limit, the frontend's client-side
      # check and its Server Action body limit - see .env.example.
      GIGLISTER_UPLOAD_MAX_SIZE_MB: ${GIGLISTER_UPLOAD_MAX_SIZE_MB:-5}
      # Empty by default - the GPT-skill integration (POST /api/submissions) is
      # disabled until you set this. See .env.example.
      GIGLISTER_GPT_SKILL_TOKEN: ${GIGLISTER_GPT_SKILL_TOKEN:-}
      # Empty by default - push notifications (see PushNotificationService) stay
      # disabled until this points at a real path. Once you have a Firebase
      # service-account JSON key (Firebase console > Project settings > Service
      # accounts > Generate new private key), add a line like
      # "- ./firebase-credentials.json:/data/firebase-credentials.json:ro" under
      # this service's volumes below and set this to that container path.
      GIGLISTER_FIREBASE_CREDENTIALS_FILE: ${GIGLISTER_FIREBASE_CREDENTIALS_FILE:-}
    volumes:
      - giglister-uploads-data:/data/uploads
    ports:
      - "${GIGLISTER_BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at image build time - this is what the *browser* calls, so
        # it must be reachable from the host, not just the Docker network.
        NEXT_PUBLIC_API_URL: ${GIGLISTER_PUBLIC_API_URL:-http://localhost:8080}
        # Also baked in at build time - ImageUploadField's client-side size
        # check runs in the browser, so it needs the same value as the
        # backend's GIGLISTER_UPLOAD_MAX_SIZE_MB above.
        NEXT_PUBLIC_UPLOAD_MAX_SIZE_MB: ${GIGLISTER_UPLOAD_MAX_SIZE_MB:-5}
        # next.config.ts reads this one itself (for the Server Action body
        # limit) - `next build` freezes the resolved config into the
        # standalone output, so this has to be a build arg too, not a
        # runtime env var, even though it isn't browser code.
        GIGLISTER_UPLOAD_MAX_SIZE_MB: ${GIGLISTER_UPLOAD_MAX_SIZE_MB:-5}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server-side (Server Components/Actions) calls go through the Docker
      # network directly to the backend service - this one is NOT the
      # published port above, it always targets the container's internal :8080.
      API_BASE_URL: http://backend:8080
      # Read by email-bestaetigen/route.ts to build its redirect target -
      # deliberately NOT inferred from the incoming request, since Next.js's
      # standalone server (output: "standalone") builds request.url from its
      # own internal view of itself (container hostname + the
      # container-internal port it listens on), not the actual public host/
      # port a browser reached it through. Same value and same purpose as
      # the backend's own GIGLISTER_FRONTEND_URL (the links inside its
      # emails) - set both to this app's real public URL once it's
      # reachable at anything other than localhost:3000.
      GIGLISTER_FRONTEND_URL: ${GIGLISTER_FRONTEND_URL:-http://localhost:3000}
      # Docker sets HOSTNAME to the container's own ID unless told
      # otherwise, and Next.js's standalone server binds to whatever
      # HOSTNAME it finds - 0.0.0.0 is the correct bind address for a
      # container (listen on every interface) regardless of the above.
      HOSTNAME: "0.0.0.0"
    ports:
      - "${GIGLISTER_FRONTEND_PORT:-3000}:3000"

volumes:
  giglister-db-data:
  giglister-uploads-data:

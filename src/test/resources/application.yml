spring:
  datasource:
    # No DB_CLOSE_DELAY override: the in-memory DB is destroyed once the last
    # connection closes, so @DirtiesContext on a test class actually resets data
    # for the next class instead of leaking rows across the whole test run.
    url: jdbc:h2:mem:giglister-test
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

giglister:
  jwt:
    secret: test-only-secret-test-only-secret-test-only-secret
    expiration-minutes: 60
  mail:
    from: no-reply@giglister.test
  frontend:
    base-url: http://localhost:3000
  upload:
    dir: target/test-uploads
  public:
    base-url: http://localhost:8080
  gpt-skill:
    token: test-only-gpt-skill-token

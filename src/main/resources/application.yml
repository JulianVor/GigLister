spring:
  application:
    name: giglister-backend

  datasource:
    url: jdbc:postgresql://${GIGLISTER_DB_HOST:localhost}:${GIGLISTER_DB_PORT:5432}/${GIGLISTER_DB_NAME:giglister}
    driver-class-name: org.postgresql.Driver
    username: ${GIGLISTER_DB_USER:giglister}
    password: ${GIGLISTER_DB_PASSWORD:giglister}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

server:
  port: 8080

giglister:
  jwt:
    secret: ${GIGLISTER_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: 1440
  admin:
    bootstrap-email: ${GIGLISTER_ADMIN_EMAIL:}

spring:
  application:
    name: giglister-backend

  datasource:
    url: jdbc:postgresql://${GIGLISTER_DB_HOST:localhost}:${GIGLISTER_DB_PORT:5432}/${GIGLISTER_DB_NAME:giglister}
    driver-class-name: org.postgresql.Driver
    username: ${GIGLISTER_DB_USER:giglister}
    password: ${GIGLISTER_DB_PASSWORD:giglister}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  servlet:
    multipart:
      max-file-size: ${GIGLISTER_UPLOAD_MAX_SIZE_MB:5}MB
      max-request-size: ${GIGLISTER_UPLOAD_MAX_SIZE_MB:5}MB

server:
  port: 8080

giglister:
  jwt:
    secret: ${GIGLISTER_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: 1440
  admin:
    bootstrap-email: ${GIGLISTER_ADMIN_EMAIL:}
  # Mail is built manually in MailService (not via Spring Boot's mail
  # auto-configuration) so that an unset host just logs the verification
  # link instead of trying - and failing - to connect. See MailService.
  mail:
    host: ${GIGLISTER_MAIL_HOST:}
    port: ${GIGLISTER_MAIL_PORT:587}
    username: ${GIGLISTER_MAIL_USER:}
    password: ${GIGLISTER_MAIL_PASSWORD:}
    from: ${GIGLISTER_MAIL_FROM:no-reply@giglister.local}
  frontend:
    base-url: ${GIGLISTER_FRONTEND_URL:http://localhost:3000}
  upload:
    dir: ${GIGLISTER_UPLOAD_DIR:uploads}
    # Single knob for every upload path - the direct multipart endpoint, the
    # GPT-skill's image-URL fetch (ImageFetchService), and the two frontend
    # checks (client-side validation + the Server Action body limit) all key
    # off this same value so they can never drift out of sync with each other.
    max-size-mb: ${GIGLISTER_UPLOAD_MAX_SIZE_MB:5}
  public:
    # Same URL the frontend uses to call the API directly from the browser
    # (see GIGLISTER_PUBLIC_API_URL in .env.example) - reused here so an
    # uploaded image's URL, once baked into logoUrl/titleImageUrl, resolves
    # for anyone viewing the page, not just from inside the Docker network.
    base-url: ${GIGLISTER_PUBLIC_API_URL:http://localhost:8080}
  gpt-skill:
    # Shared secret for the external GPT-skill integration (POST /api/submissions
    # only - see SecurityConfig/GptSkillAuthFilter). Empty by default: unset means
    # the integration is disabled, nobody can authenticate as it.
    token: ${GIGLISTER_GPT_SKILL_TOKEN:}
  geocoding:
    # Off in tests (see src/test/resources/application.yml) so the suite never
    # depends on outbound network access to Nominatim.
    enabled: ${GIGLISTER_GEOCODING_ENABLED:true}
  firebase:
    # Path to a Firebase service-account JSON key file (Project settings > Service
    # accounts > Generate new private key). Unset (the default, including in tests) just
    # disables push notifications entirely rather than failing to start - see
    # PushNotificationService.
    credentials-file: ${GIGLISTER_FIREBASE_CREDENTIALS_FILE:}
